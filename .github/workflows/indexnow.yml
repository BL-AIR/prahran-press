# Tells Bing (and other IndexNow search engines) about the site's pages
# after every push to main, so changes are picked up quickly.
# The key file 7788c577d45568b22597a283b7b6d692.txt at the site root proves we own the domain.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to publish the new version
        run: sleep 120

      - name: Send the sitemap's pages to IndexNow
        run: |
          URLS=$(curl -fsSL https://prahran.press/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          jq -n --argjson urls "$URLS" \
            '{host: "prahran.press", key: "7788c577d45568b22597a283b7b6d692", keyLocation: "https://prahran.press/7788c577d45568b22597a283b7b6d692.txt", urlList: $urls}' > body.json
          cat body.json
          CODE=$(curl -sS -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json)
          echo "IndexNow responded: $CODE"; cat resp.txt
          case "$CODE" in 200|202) ;; *) exit 1 ;; esac
